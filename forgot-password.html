<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — MY EVENT PLANNER</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card animate-slideUp">

    <div class="auth-logo">
      <div class="logo-icon">🎉</div>
      <h1>MY EVENT PLANNER</h1>
      <p>Professional Event Management Platform</p>
    </div>

    <!-- Step 1: Enter email -->
    <div id="form-view">
      <h2 class="auth-title">Reset your password</h2>
      <p class="auth-subtitle">Enter your email address and we'll send you a reset link.</p>

      <div id="alert-box"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email"/>
          </div>
          <div class="invalid-feedback" id="email-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="reset-btn">
          <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html" class="auth-link"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
      </div>
    </div>

    <!-- Step 2: Success message -->
    <div id="success-view" class="hidden" style="text-align:center;padding:10px 0">
      <div style="font-size:3.5rem;margin-bottom:18px">📧</div>
      <h3 style="font-size:1.25rem;font-weight:700;color:var(--dark);margin-bottom:10px">Check your inbox</h3>
      <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:6px">
        We sent a password reset link to:
      </p>
      <p style="font-weight:700;color:var(--dark);margin-bottom:18px" id="sent-email-display"></p>
      <p style="color:var(--text-muted);font-size:0.83rem;margin-bottom:28px">
        Check your spam folder if you don't see it within a few minutes.
      </p>
      <a href="login.html" class="btn btn-primary btn-block btn-lg">
        <i class="fas fa-arrow-left"></i> Back to Sign In
      </a>
      <div style="margin-top:16px">
        <button class="btn btn-outline btn-sm" id="resend-btn">
          <i class="fas fa-rotate-right"></i> Resend Email
        </button>
      </div>
    </div>

  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // Redirect if already authenticated
  window.onAuthReady = (user) => {
    if (user) window.location.href = 'index.html';
  };

  const alertBox = document.getElementById('alert-box');
  let lastEmail = '';

  function showAlert(msg, type = 'danger') {
    alertBox.innerHTML = `
      <div class="alert alert-${type}">
        <i class="fas fa-${type === 'danger' ? 'circle-exclamation' : 'circle-check'}"></i>
        <span>${msg}</span>
      </div>`;
  }
  function clearAlert() { alertBox.innerHTML = ''; }

  async function sendReset(email) {
    await auth.sendPasswordResetEmail(email, {
      // Optional: set a custom continue URL so users land back on login
      url: window.location.origin + '/login.html'
    });
  }

  document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert();

    const emailInput = document.getElementById('email');
    const emailErr   = document.getElementById('email-error');
    const email      = emailInput.value.trim();

    // Validate
    if (!email) {
      emailInput.classList.add('is-invalid');
      emailErr.textContent = 'Please enter your email address.';
      return;
    }
    emailInput.classList.remove('is-invalid');
    emailErr.textContent = '';

    const btn = document.getElementById('reset-btn');
    btn.classList.add('btn-loading');
    btn.disabled = true;

    try {
      await sendReset(email);
      lastEmail = email;
      // Show success view
      document.getElementById('form-view').classList.add('hidden');
      document.getElementById('success-view').classList.remove('hidden');
      document.getElementById('sent-email-display').textContent = email;
    } catch (err) {
      btn.classList.remove('btn-loading');
      btn.disabled = false;

      const msgs = {
        'auth/user-not-found':    'No account found with this email address.',
        'auth/invalid-email':     'Please enter a valid email address.',
        'auth/too-many-requests': 'Too many requests. Please wait a few minutes before trying again.',
        'auth/missing-email':     'Please enter your email address.'
      };
      showAlert(msgs[err.code] || 'Failed to send reset email. Please try again.');
    }
  });

  // Resend button
  document.getElementById('resend-btn').addEventListener('click', async function () {
    if (!lastEmail) return;
    this.classList.add('btn-loading');
    this.disabled = true;
    try {
      await sendReset(lastEmail);
      // Brief confirmation
      this.textContent = '✓ Sent!';
      setTimeout(() => {
        this.classList.remove('btn-loading');
        this.disabled = false;
        this.innerHTML = '<i class="fas fa-rotate-right"></i> Resend Email';
      }, 3000);
    } catch (err) {
      this.classList.remove('btn-loading');
      this.disabled = false;
      alert(err.message);
    }
  });
</script>
</body>
</html>
