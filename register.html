<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — MY EVENT PLANNER</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card animate-slideUp" style="max-width:520px">
    <div class="auth-logo">
      <div class="logo-icon">🎉</div>
      <h1>MY EVENT PLANNER</h1>
      <p>Professional Event Management Platform</p>
    </div>

    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Join the platform and start planning events</p>

    <div id="alert-box"></div>

    <form id="register-form" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="first-name" class="form-control" placeholder="John" required/>
          </div>
          <div class="invalid-feedback" id="fn-error"></div>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <div class="input-group">
            <i class="fas fa-user input-icon"></i>
            <input type="text" id="last-name" class="form-control" placeholder="Doe" required/>
          </div>
          <div class="invalid-feedback" id="ln-error"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
        </div>
        <div class="invalid-feedback" id="email-error"></div>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <div class="input-group">
          <i class="fas fa-phone input-icon"></i>
          <input type="tel" id="phone" class="form-control" placeholder="+1 555 000 0000"/>
        </div>
      </div>

      <div class="form-group">
        <label>Role</label>
        <div class="input-group">
          <i class="fas fa-id-badge input-icon"></i>
          <select id="role" class="form-control">
            <option value="event_planner">Event Planner</option>
            <option value="staff">Staff</option>
            <option value="client">Client</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required/>
          <i class="fas fa-eye input-icon-right" id="toggle-pw" style="cursor:pointer"></i>
        </div>
        <div class="invalid-feedback" id="pw-error"></div>
        <div id="pw-strength" style="margin-top:8px"></div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="confirm-password" class="form-control" placeholder="Re-enter password" required/>
          <i class="fas fa-eye input-icon-right" id="toggle-cpw" style="cursor:pointer"></i>
        </div>
        <div class="invalid-feedback" id="cpw-error"></div>
      </div>

      <div style="margin-bottom:20px">
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:0.85rem;color:var(--text-muted);cursor:pointer">
          <input type="checkbox" id="terms" style="accent-color:var(--primary);margin-top:3px"/>
          I agree to the <a href="#" class="auth-link" style="margin:0 4px">Terms of Service</a> and <a href="#" class="auth-link">Privacy Policy</a>
        </label>
        <div class="invalid-feedback" id="terms-error"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html" class="auth-link">Sign in</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  window.onAuthReady = (user) => { if (user) window.location.href = 'index.html'; };

  const alertBox = document.getElementById('alert-box');
  function showAlert(msg, type='danger') {
    alertBox.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type==='danger'?'circle-exclamation':'check-circle'}"></i><span>${msg}</span></div>`;
  }
  function clearAlert() { alertBox.innerHTML = ''; }

  // Password toggles
  ['toggle-pw','toggle-cpw'].forEach(id => {
    document.getElementById(id).addEventListener('click', function() {
      const target = id === 'toggle-pw' ? 'password' : 'confirm-password';
      const inp = document.getElementById(target);
      if (inp.type === 'password') { inp.type='text'; this.classList.replace('fa-eye','fa-eye-slash'); }
      else { inp.type='password'; this.classList.replace('fa-eye-slash','fa-eye'); }
    });
  });

  // Password strength
  document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const strength = document.getElementById('pw-strength');
    if (!val) { strength.innerHTML=''; return; }
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const labels = ['','Weak','Fair','Good','Strong'];
    const colors = ['','var(--danger)','var(--warning)','var(--info)','var(--success)'];
    strength.innerHTML = `<div style="display:flex;gap:4px;align-items:center;margin-top:4px">
      ${[1,2,3,4].map(i=>`<div style="height:4px;flex:1;border-radius:99px;background:${i<=score?colors[score]:'var(--border)'};transition:all 0.3s"></div>`).join('')}
      <span style="font-size:0.75rem;color:${colors[score]};font-weight:600;min-width:44px">${labels[score]}</span>
    </div>`;
  });

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert();
    const firstName = document.getElementById('first-name').value.trim();
    const lastName  = document.getElementById('last-name').value.trim();
    const email     = document.getElementById('email').value.trim();
    const phone     = document.getElementById('phone').value.trim();
    const role      = document.getElementById('role').value;
    const password  = document.getElementById('password').value;
    const confirm   = document.getElementById('confirm-password').value;
    const terms     = document.getElementById('terms').checked;
    const btn = document.getElementById('register-btn');
    btn.classList.add('btn-loading'); btn.disabled = true;

    let valid = true;

    const setErr = (id, msg) => {
      const errEl = document.getElementById(id);
      if (errEl) errEl.textContent = msg;
    };

    if (!firstName) { setErr('fn-error','First name required'); valid=false; }
    else setErr('fn-error','');
    if (!lastName)  { setErr('ln-error','Last name required'); valid=false; }
    else setErr('ln-error','');
    if (!email)     { setErr('email-error','Email required'); valid=false; }
    else setErr('email-error','');
    if (password.length < 8) { setErr('pw-error','Password must be at least 8 characters'); valid=false; }
    else setErr('pw-error','');
    if (password !== confirm) { setErr('cpw-error','Passwords do not match'); valid=false; }
    else setErr('cpw-error','');
    if (!terms) { setErr('terms-error','You must accept the terms'); valid=false; }
    else setErr('terms-error','');

    if (!valid) {
      btn.classList.remove('btn-loading'); btn.disabled = false;
      return;
    }

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await cred.user.updateProfile({ displayName: `${firstName} ${lastName}` });
      await db.collection(COLLECTIONS.USERS).doc(cred.user.uid).set({
        uid: cred.user.uid,
        firstName, lastName,
        displayName: `${firstName} ${lastName}`,
        email, phone, role,
        status: 'active',
        photoURL: '',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      window.location.href = 'index.html';
    } catch (err) {
      btn.classList.remove('btn-loading'); btn.disabled = false;
      const msgs = {
        'auth/email-already-in-use': 'An account with this email already exists.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/weak-password': 'Password is too weak. Use at least 6 characters.',
        'auth/operation-not-allowed': 'Registration is temporarily disabled.'
      };
      showAlert(msgs[err.code] || err.message);
    }
  });
</script>
</body>
</html>
