<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — MY EVENT PLANNER</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card animate-slideUp">
    <div class="auth-logo">
      <div class="logo-icon">🎉</div>
      <h1>MY EVENT PLANNER</h1>
      <p>Professional Event Management Platform</p>
    </div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Sign in to your account to continue</p>

    <div id="alert-box"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-group">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email"/>
        </div>
        <div class="invalid-feedback" id="email-error"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password"/>
          <i class="fas fa-eye input-icon-right" id="toggle-pw" style="cursor:pointer"></i>
        </div>
        <div class="invalid-feedback" id="pw-error"></div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--text-muted);cursor:pointer">
          <input type="checkbox" id="remember-me" style="accent-color:var(--primary)"/> Remember me
        </label>
        <a href="forgot-password.html" class="auth-link" style="font-size:0.85rem">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="auth-divider">or</div>

    <div class="auth-footer">
      Don't have an account? <a href="register.html" class="auth-link">Create one</a>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  // Redirect if already logged in
  window.onAuthReady = (user) => {
    if (user) window.location.href = 'index.html';
  };

  const loginForm = document.getElementById('login-form');
  const loginBtn  = document.getElementById('login-btn');
  const alertBox  = document.getElementById('alert-box');

  // Password toggle
  document.getElementById('toggle-pw').addEventListener('click', function() {
    const pw = document.getElementById('password');
    if (pw.type === 'password') { pw.type = 'text'; this.classList.replace('fa-eye','fa-eye-slash'); }
    else { pw.type = 'password'; this.classList.replace('fa-eye-slash','fa-eye'); }
  });

  function showAlert(msg, type = 'danger') {
    alertBox.innerHTML = `<div class="alert alert-${type}"><i class="fas fa-${type==='danger'?'circle-exclamation':'check-circle'}"></i><span>${msg}</span></div>`;
  }
  function clearAlert() { alertBox.innerHTML = ''; }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlert();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    if (!email) {
      document.getElementById('email-error').textContent = 'Email is required';
      document.getElementById('email').classList.add('is-invalid');
      valid = false;
    } else {
      document.getElementById('email').classList.remove('is-invalid');
      document.getElementById('email-error').textContent = '';
    }
    if (!password) {
      document.getElementById('pw-error').textContent = 'Password is required';
      document.getElementById('password').classList.add('is-invalid');
      valid = false;
    } else {
      document.getElementById('password').classList.remove('is-invalid');
      document.getElementById('pw-error').textContent = '';
    }
    if (!valid) return;

    loginBtn.classList.add('btn-loading');
    loginBtn.disabled = true;

    try {
      const persistence = document.getElementById('remember-me').checked
        ? firebase.auth.Auth.Persistence.LOCAL
        : firebase.auth.Auth.Persistence.SESSION;
      await auth.setPersistence(persistence);
      await auth.signInWithEmailAndPassword(email, password);
      window.location.href = 'index.html';
    } catch (err) {
      loginBtn.classList.remove('btn-loading');
      loginBtn.disabled = false;
      const msgs = {
        'auth/user-not-found': 'No account found with this email address.',
        'auth/wrong-password': 'Incorrect password. Please try again.',
        'auth/invalid-email': 'Please enter a valid email address.',
        'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
        'auth/user-disabled': 'This account has been disabled. Contact support.',
        'auth/invalid-credential': 'Invalid email or password.'
      };
      showAlert(msgs[err.code] || 'Sign in failed. Please try again.');
    }
  });
</script>
</body>
</html>
